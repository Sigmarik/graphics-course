name: comment-lint-results

permissions:
  checks: write
  pull-requests: write

on:
  workflow_run:
    workflows: ["lint"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: ZedThree/clang-tidy-review/post@v0.21.0
        with:
          lgtm_comment_body: 'Based 🗿'
          annotations: false
          max_comments: 10
